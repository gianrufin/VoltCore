name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'app/build.gradle.kts'
      - '.github/workflows/pages.yml'
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync app version to docs
        run: |
          GRADLE_VER=$(grep -E '\?: "[0-9]+\.[0-9]+\.[0-9]+"' app/build.gradle.kts | head -n 1 | sed -E 's/.*"([0-9]+\.[0-9]+\.[0-9]+)".*/\1/' || true)
          TAG_VER=$(git tag -l 'v*' --sort=-v:refname | head -n 1 | sed 's/^v//' || true)
          if [[ -n "${{ github.event.release.tag_name }}" ]]; then
            REL_VER="${{ github.event.release.tag_name }}"
            REL_VER="${REL_VER#v}"
          else
            REL_VER=""
          fi

          VERSION=$(printf '%s\n%s\n%s\n' "$GRADLE_VER" "$TAG_VER" "$REL_VER" | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || echo "1.1.0")
          TAG="v${VERSION}"
          echo "Synced landing page version to ${TAG}"

          cat > docs/version.json <<EOF
          {
            "version": "${VERSION}",
            "tag": "${TAG}"
          }
          EOF

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload docs artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
